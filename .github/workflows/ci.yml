name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, server, client)
        run: npm run typecheck
      - name: Engine self-tests
        run: npm run test:engine
      - name: AI self-tests
        run: npm run test:ai
      - name: Build client
        run: npm run build
